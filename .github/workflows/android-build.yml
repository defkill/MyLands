name: Android Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      - name: Generate Gradle Wrapper Files
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mv debug.keystore app/

      - name: Lint with Gradle
        run: ./gradlew lint --continue

      - name: Build Debug APK
        run: ./gradlew assembleDebug
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process"

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-artifacts
          path: app/build/outputs/apk/debug/
          retention-days: 30

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 7

      - name: Comment PR with build results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testReportPath = './app/build/reports/tests/testDebugUnitTest/index.html';
            
            let comment = '## Build Report\n\n';
            comment += '✅ **Build Status**: ';
            comment += '${{ job.status }}' === 'success' ? '✓ Success' : '✗ Failed';
            comment += '\n\n';
            comment += '📦 **Artifacts**:\n';
            comment += '- Debug APK: `app/build/outputs/apk/debug/app-debug.apk`\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
