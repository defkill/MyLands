name: Android Build

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build release APK/AAB'
        required: false
        type: boolean
        default: false

# Uploading files to GitHub one at a time triggers a run per file. Cancel the superseded
# ones so only the latest push actually builds instead of queueing a pile of runners.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.3.1

      # gradle-wrapper.jar is not committed to this repository, so ./gradlew cannot run
      # until the wrapper is regenerated here. Keep this step unless the jar is added.
      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew

      # Use stable debug.keystore from Secret if configured, otherwise generate one.
      - name: Restore or generate debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "Restoring debug.keystore from repository secret..."
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Build the APK first, so a usable artifact exists even if lint or tests fail later.
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Lint findings are informational and must not block shipping a debug build.
      - name: Lint
        continue-on-error: true
        run: ./gradlew lint --continue

      - name: Run Unit Tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"

      - name: Upload Test Reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 7

  release:
    name: Build Release (AAB & APK)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release == true)
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.3.1

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew

      - name: Decode Release Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.jks"

      - name: Build Release Artifacts
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: apk-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v6
        with:
          name: aab-release
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

