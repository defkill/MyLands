name: Android Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

                - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.3.1

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Lint with Gradle
        run: ./gradlew lint --continue

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-artifacts
          path: app/build/outputs/apk/
          retention-days: 30

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 7

      - name: Comment PR with build results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testReportPath = './app/build/reports/tests/testDebugUnitTest/index.html';
            
            let comment = '## Build Report\n\n';
            comment += '✅ **Build Status**: ';
            comment += '${{ job.status }}' === 'success' ? '✓ Success' : '✗ Failed';
            comment += '\n\n';
            comment += '📦 **Artifacts**:\n';
            comment += '- Debug APK: `app/build/outputs/apk/debug/app-debug.apk`\n';
            comment += '- Release APK: `app/build/outputs/apk/release/app-release.apk`\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            
