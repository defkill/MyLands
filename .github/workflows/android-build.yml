name: Android Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.3.1

      # gradle-wrapper.jar is not committed to this repository, so ./gradlew cannot run
      # until the wrapper is regenerated here. Keep this step unless the jar is added.
      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew

      # Build the APK first, so a usable artifact exists even if lint or tests fail later.
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Lint findings are informational and must not block shipping a debug build.
      - name: Lint
        continue-on-error: true
        run: ./gradlew lint --continue

      - name: Run Unit Tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 7
