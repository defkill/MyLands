name: Android Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# Uploading files to GitHub one at a time triggers a run per file. Cancel the superseded
# ones so only the latest push actually builds instead of queueing a pile of runners.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.3.1

      # gradle-wrapper.jar is not committed to this repository, so ./gradlew cannot run
      # until the wrapper is regenerated here. Keep this step unless the jar is added.
      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew

      # app/build.gradle.kts declares a custom "debugConfig" signing config pointing at
      # debug.keystore in the project root, and that file is not committed — so it has to
      # be created here or :app:validateSigningDebug fails.
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # Build the APK first, so a usable artifact exists even if lint or tests fail later.
      - name: Build Debug APK
        run: ./gradlew assembleDebug
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # Lint findings are informational and must not block shipping a debug build.
      - name: Lint
        continue-on-error: true
        run: ./gradlew lint --continue

      - name: Run Unit Tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true"

      - name: Upload Test Reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 7
